[project]
name = "vk_uploader"
version = "0.0.1"
description = "CLI tool to download YouTube videos and upload them to VK with scheduling"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "deep-translator>=1.11",
    "pyyaml>=6.0",
    "requests>=2.31",
    "requests-toolbelt>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.scripts]
vk_uploader = "vk_uploader.cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", "__pycache__", ".mypy_cache", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
exclude = ["tests/"]
